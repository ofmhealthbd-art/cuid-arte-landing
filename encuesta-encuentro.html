<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/analytics.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>¿Cómo fue tu Encuentro? | Cuid-Arte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                'cuidarte-green': '#6BA06B', 'cuidarte-mint': '#CDE8CD', 'cuidarte-gold': '#D4AF37',
                'cuidarte-dark': '#1A2E1A', 'cuidarte-green-deep': '#4F7F50', 'cuidarte-muted': '#5B6F5B',
            }, fontFamily: { sans: ['Open Sans','sans-serif'], heading: ['Montserrat','sans-serif'] } } }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FAF9F6] font-sans text-cuidarte-dark min-h-screen py-6 px-4">

<main class="w-full max-w-lg mx-auto">
    <div class="bg-white rounded-3xl shadow-[0_4px_24px_rgba(26,46,26,0.08)] overflow-hidden">
        <div class="bg-gradient-to-br from-cuidarte-green to-cuidarte-green-deep border-b-4 border-cuidarte-gold px-6 py-7 text-center">
            <p class="font-heading font-bold text-white text-xl">Cuid-Arte</p>
            <p class="text-white/85 text-[11px] uppercase tracking-[1.5px] mt-1">Encuentro &middot; Hinojares</p>
        </div>
        <div id="contenido" class="px-6 py-8">
            <p class="text-center text-cuidarte-muted text-sm py-6">Un momento&hellip;</p>
        </div>
    </div>
    <p class="text-center text-xs text-cuidarte-muted mt-5 leading-relaxed">
        Tus respuestas las lee solo el equipo de Cuid-Arte.<br>
        NEIKO HEALTH, S.L. &middot; CIF B22928311
    </p>
</main>

<script>
// Encuesta posterior al Encuentro. Todo lo decide el token del enlace; esta pantalla no sabe de
// quien es hasta que el servidor se lo dice. Ninguna pregunta es obligatoria: una encuesta que
// obliga se abandona a la mitad y no deja ni lo poco que la persona si queria contar.
const FN = 'https://hapzytcloqivthmkodjg.supabase.co/functions/v1/encuentro-encuesta';
const token = new URLSearchParams(location.search).get('t') || '';
const cont = document.getElementById('contenido');
const R = {};

function aviso(titulo, texto) {
    cont.innerHTML = '<p class="font-heading font-bold text-lg text-center mb-2">' + titulo + '</p>'
        + '<p class="text-sm text-cuidarte-muted text-center leading-relaxed">' + texto + '</p>';
}

function gracias(nombre) {
    cont.innerHTML = '<p class="text-5xl text-center mb-4">&#128154;</p>'
        + '<p class="font-heading font-bold text-xl text-center mb-3">' + (nombre ? nombre + ', gracias' : 'Gracias') + '</p>'
        + '<p class="text-sm text-cuidarte-muted text-center leading-relaxed">Lo leemos todo, una por una. Lo que nos cuentas es lo que hace que el siguiente encuentro sea mejor que este.</p>';
}

function escala(campo, etiqueta, ayuda) {
    let botones = '';
    for (let i = 1; i <= 5; i++) {
        botones += '<button type="button" data-c="' + campo + '" data-v="' + i + '" '
            + 'class="nota flex-1 py-3 rounded-xl border-2 border-cuidarte-green/25 font-heading font-bold text-sm transition-all">' + i + '</button>';
    }
    return '<div class="mb-6">'
        + '<p class="font-heading font-semibold text-sm mb-1">' + etiqueta + '</p>'
        + (ayuda ? '<p class="text-xs text-cuidarte-muted mb-2">' + ayuda + '</p>' : '')
        + '<div class="flex gap-2">' + botones + '</div>'
        + '</div>';
}

function pintarFormulario(d) {
    const saludo = d.first_name ? d.first_name + ', ¿' : '¿';
    cont.innerHTML = ''
        + '<h1 class="font-heading font-bold text-xl text-center leading-snug mb-2">' + saludo + 'cómo fue para ti?</h1>'
        + '<p class="text-sm text-cuidarte-muted text-center leading-relaxed mb-7">Son dos minutos. No hace falta que contestes a todo: con lo que quieras contarnos nos vale.</p>'

        + escala('valoracion_global', '¿Qué tal el encuentro en general?', '1 es "no era para mí", 5 es "volvería mañana"')
        + (d.con_alojamiento ? escala('val_alojamiento', 'El alojamiento') : '')
        + escala('val_comidas', 'Las comidas')
        + escala('val_actividades', 'Las actividades', 'Senderismo, formación, caballos, gestión emocional, entrenamiento')
        + escala('val_equipo', 'El acompañamiento del equipo')

        + '<div class="mb-6">'
        +   '<p class="font-heading font-semibold text-sm mb-1">¿Se lo recomendarías a otra mujer que esté pasando por algo parecido?</p>'
        +   '<p class="text-xs text-cuidarte-muted mb-2">Del 0 al 10</p>'
        +   '<div class="grid grid-cols-6 gap-1.5" id="nps"></div>'
        + '</div>'

        + '<div class="mb-6">'
        +   '<p class="font-heading font-semibold text-sm mb-2">¿Volverías a otra edición?</p>'
        +   '<div class="flex gap-2">'
        +     '<button type="button" data-c="volveria" data-v="si" class="opcion flex-1 py-3 rounded-xl border-2 border-cuidarte-green/25 font-heading font-semibold text-sm">Sí</button>'
        +     '<button type="button" data-c="volveria" data-v="quiza" class="opcion flex-1 py-3 rounded-xl border-2 border-cuidarte-green/25 font-heading font-semibold text-sm">Quizá</button>'
        +     '<button type="button" data-c="volveria" data-v="no" class="opcion flex-1 py-3 rounded-xl border-2 border-cuidarte-green/25 font-heading font-semibold text-sm">No</button>'
        +   '</div>'
        + '</div>'

        + '<div class="mb-5">'
        +   '<label class="font-heading font-semibold text-sm block mb-2">¿Qué es lo que más te llevas?</label>'
        +   '<textarea id="lo_mejor" rows="3" class="w-full px-4 py-3 rounded-2xl border border-cuidarte-green/25 text-sm outline-none focus:border-cuidarte-green"></textarea>'
        + '</div>'

        + '<div class="mb-5">'
        +   '<label class="font-heading font-semibold text-sm block mb-1">¿Qué cambiarías?</label>'
        +   '<p class="text-xs text-cuidarte-muted mb-2">Con toda la sinceridad: es lo que más nos sirve.</p>'
        +   '<textarea id="a_mejorar" rows="3" class="w-full px-4 py-3 rounded-2xl border border-cuidarte-green/25 text-sm outline-none focus:border-cuidarte-green"></textarea>'
        + '</div>'

        + '<div class="mb-6 p-4 rounded-2xl bg-cuidarte-mint/25">'
        +   '<label class="font-heading font-semibold text-sm block mb-1">Si quieres dejarnos unas palabras</label>'
        +   '<p class="text-xs text-cuidarte-muted mb-2">Solo si te apetece, y solo las usaremos si nos das permiso aquí abajo.</p>'
        +   '<textarea id="testimonio" rows="3" class="w-full px-4 py-3 rounded-2xl border border-cuidarte-green/25 text-sm outline-none focus:border-cuidarte-green"></textarea>'
        +   '<label class="flex items-start gap-2 mt-3 cursor-pointer">'
        +     '<input type="checkbox" id="permiso" class="mt-1 w-4 h-4 accent-[#6BA06B]">'
        +     '<span class="text-xs text-cuidarte-muted leading-relaxed">Podéis compartir estas palabras con mi nombre de pila para que otras mujeres sepan de qué va el encuentro.</span>'
        +   '</label>'
        + '</div>'

        + '<button type="button" id="enviar" class="w-full bg-cuidarte-green hover:bg-cuidarte-green-deep text-white font-heading font-bold py-4 rounded-2xl transition-all">Enviar</button>';

    // NPS 0-10
    const nps = document.getElementById('nps');
    for (let i = 0; i <= 10; i++) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = i;
        b.className = 'nota py-2.5 rounded-lg border-2 border-cuidarte-green/25 font-heading font-bold text-xs transition-all';
        b.dataset.c = 'nps'; b.dataset.v = i;
        nps.appendChild(b);
    }

    cont.querySelectorAll('.nota, .opcion').forEach(function (b) {
        b.addEventListener('click', function () {
            const campo = b.dataset.c;
            R[campo] = b.dataset.v;
            cont.querySelectorAll('[data-c="' + campo + '"]').forEach(function (o) {
                o.classList.remove('bg-cuidarte-green', 'text-white', 'border-cuidarte-green');
            });
            b.classList.add('bg-cuidarte-green', 'text-white', 'border-cuidarte-green');
        });
    });

    document.getElementById('enviar').addEventListener('click', enviar);
}

async function enviar() {
    const boton = document.getElementById('enviar');
    boton.disabled = true;
    boton.textContent = 'Enviando…';
    const cuerpo = {
        t: token, accion: 'responder',
        nps: R.nps, valoracion_global: R.valoracion_global, val_alojamiento: R.val_alojamiento,
        val_comidas: R.val_comidas, val_actividades: R.val_actividades, val_equipo: R.val_equipo,
        volveria: R.volveria,
        lo_mejor: document.getElementById('lo_mejor').value,
        a_mejorar: document.getElementById('a_mejorar').value,
        testimonio: document.getElementById('testimonio').value,
        permiso_testimonio: document.getElementById('permiso').checked,
    };
    try {
        const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
        const d = await r.json();
        if (r.ok && d.ok) { gracias(d.first_name); window.scrollTo(0, 0); return; }
        if (d.error === 'ya_respondida') { gracias(d.first_name); window.scrollTo(0, 0); return; }
        boton.disabled = false; boton.textContent = 'Enviar';
        aviso('No hemos podido guardar tus respuestas', 'Prueba otra vez en un minuto, por favor.');
    } catch (e) {
        boton.disabled = false; boton.textContent = 'Enviar';
        aviso('No hemos podido guardar tus respuestas', 'Prueba otra vez en un minuto, por favor.');
    }
}

(async function () {
    if (!token) { aviso('Este enlace no es v&aacute;lido', 'Puede que se haya copiado a medias. Escr&iacute;benos y te mandamos uno nuevo.'); return; }
    try {
        const r = await fetch(FN + '?t=' + encodeURIComponent(token) + '&accion=info');
        const d = await r.json();
        if (r.ok && d.ok) {
            if (d.ya_respondida) { gracias(d.first_name); return; }
            pintarFormulario(d);
            return;
        }
        if (d.error === 'enlace_caducado') {
            aviso('Este enlace ya ha caducado', 'Si a&uacute;n quieres contarnos qu&eacute; te parecio, escr&iacute;benos por WhatsApp: nos encantar&aacute; leerte.');
            return;
        }
        aviso('Este enlace no es v&aacute;lido', 'Escr&iacute;benos y te mandamos uno nuevo.');
    } catch (e) {
        aviso('No hemos podido cargar la encuesta', 'Prueba a abrir el enlace de nuevo en un minuto.');
    }
})();
</script>
</body>
</html>
