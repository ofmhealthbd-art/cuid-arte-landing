<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Portada CERRADA a nuevas alumnas (17-sep-2026). Sin formulario, sin correo de
         contacto, sin analítica: nadie puede escribir ni entrar desde aquí. La portada
         de venta anterior vive en git (commit d4c7403); reabrir es revertir. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Cuid-Arte</title>
    <meta name="description" content="La Escuela Cuid-Arte está cerrada a nuevas alumnas.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #6BA06B;
            --verde-oscuro: #558055;
            --menta: #CDE8CD;
            --oro: #D4AF37;
            --tinta: #1A2530;
            --gris: #64748b;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: 'Open Sans', system-ui, sans-serif;
            color: var(--tinta);
            background: linear-gradient(180deg, #ffffff 0%, #f1f8f1 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }
        .tarjeta { max-width: 560px; text-align: center; }
        .marca {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }
        .marca-nombre {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: .02em;
            text-align: left;
            line-height: 1.1;
        }
        .marca-nombre span { color: var(--oro); }
        .marca-lema {
            font-size: .8rem;
            color: var(--gris);
            text-align: left;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: clamp(1.6rem, 4.5vw, 2.3rem);
            line-height: 1.2;
            margin: 0 0 18px;
        }
        p.sub { font-size: 1.05rem; line-height: 1.6; color: #334155; margin: 0 0 36px; }
        .boton {
            display: inline-block;
            background: var(--verde-oscuro);
            color: #fff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 999px;
            transition: background .2s;
        }
        .boton:hover, .boton:focus { background: var(--tinta); }
        footer {
            padding: 24px 20px 32px;
            text-align: center;
            font-size: .8rem;
            color: var(--gris);
        }
        footer nav a { color: var(--gris); text-decoration: none; margin: 0 10px; }
        footer nav a:hover { color: var(--tinta); text-decoration: underline; }
        footer p { margin: 12px 0 0; }
    </style>
</head>
<body>
    <main>
        <div class="tarjeta">
            <div class="marca">
                <svg viewBox="0 0 100 100" width="52" height="52" aria-hidden="true">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#D4AF37" stroke-width="3.5" />
                    <path d="M50 95 V5" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" />
                    <path d="M50 30 L80 15" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" />
                    <path d="M50 30 L20 15" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" />
                    <path d="M50 50 L80 35" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" />
                    <path d="M50 50 L20 35" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round" />
                </svg>
                <div>
                    <div class="marca-nombre">Cuid<span>·</span>Arte</div>
                    <div class="marca-lema">Método Dra. Odile Fernández</div>
                </div>
            </div>

            <h1>La Escuela Cuid-Arte está cerrada a nuevas alumnas.</h1>
            <p class="sub">Seguimos acompañando a quienes ya forman parte de la escuela.</p>

            <a class="boton" href="https://alumnos.escuelacuidarte.com/">Acceso alumnas</a>
        </div>
    </main>

    <footer>
        <nav>
            <a href="legal.html">Aviso legal</a>
            <a href="privacidad.html">Privacidad</a>
            <a href="condiciones.html">Condiciones</a>
            <a href="politica-cookies.html">Cookies</a>
        </nav>
        <p>Servicio prestado por NEIKO HEALTH, S.L.</p>
    </footer>
</body>
</html>
