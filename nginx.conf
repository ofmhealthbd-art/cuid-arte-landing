server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ─── Compresión ────────────────────────────────────────────────────────────
  # El HTML va con `no-store`, así que se descarga ENTERO en cada visita: sin
  # comprimir eran 166 KB por visita, y el JS compilado son otros 128 KB. text/html
  # lo comprime nginx solo al activar gzip; el resto hay que nombrarlo.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  # ─── Lo que no es el sitio ─────────────────────────────────────────────────
  # La imagen copia la carpeta entera, así que hasta hoy se servían en abierto
  # `entrypoint.sh`, `Dockerfile`, `nginx.conf` y las notas internas: comprobado
  # el 4-sep, los cinco devolvían 200. No es una brecha, pero enseña los nombres
  # de las variables de entorno y cómo está montado esto. Fuera.
  location ~* ^/(Dockerfile|entrypoint\.sh|nginx\.conf)$ { return 404; }
  location ~* \.md$ { return 404; }
  # Ficheros ocultos (.dockerignore, .gitignore…), salvo la carpeta de retos ACME.
  location ~ /\.(?!well-known) { return 404; }

  # ─── Escuela cerrada a nuevas alumnas (17-sep-2026) ────────────────────────
  # Las páginas de venta (método, encuentro, membresía) saltan a la portada, que ya
  # no capta a nadie. 302 y no 301 a propósito: es un cierre «por ahora», y un 301
  # lo cachearía el navegador y Google para siempre. Las páginas de las alumnas
  # (renovar, pago, salida, devolución, acceso) y las legales NO se tocan.
  # `try_files` acepta la URL sin `.html`, así que se cubren las dos formas.
  location ~* ^/(metodo|encuentro|pagar-encuentro|encuesta-encuentro|membresia|membresia-ok)(\.html)?$ {
    return 302 /;
  }

  # ─── Cabeceras de seguridad ────────────────────────────────────────────────
  # Requeridas/recomendadas por Redsys para TPV Virtual en producción.
  # HSTS (1 año, incluye subdominios). El TLS lo termina el proxy/CDN; igualmente
  # forzamos el upgrade del cliente.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Anti clickjacking — la pasarela Redsys carga en redirect, no en iframe.
  add_header X-Frame-Options "SAMEORIGIN" always;
  # MIME sniffing off
  add_header X-Content-Type-Options "nosniff" always;
  # Referrer mínimo necesario
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Restringir APIs sensibles del navegador
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
  # CSP — permite Tailwind CDN, Google Fonts, Supabase, Redsys y Stripe (encuentro.html).
  # 'unsafe-inline' es necesario para el config inline de Tailwind y los scripts pequeños inline.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://monitorizacion-umami.pqtiji.easypanel.host; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://hapzytcloqivthmkodjg.supabase.co wss://hapzytcloqivthmkodjg.supabase.co https://api.resend.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://monitorizacion-umami.pqtiji.easypanel.host; form-action 'self' https://sis.redsys.es https://sis-t.redsys.es:25443 https://buy.stripe.com; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

  # ─── Caché ─────────────────────────────────────────────────────────────────
  # HTML siempre fresco para que cambios legales/precios lleguen al usuario.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com https://monitorizacion-umami.pqtiji.easypanel.host; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://hapzytcloqivthmkodjg.supabase.co wss://hapzytcloqivthmkodjg.supabase.co https://api.resend.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://monitorizacion-umami.pqtiji.easypanel.host; form-action 'self' https://sis.redsys.es https://sis-t.redsys.es:25443 https://buy.stripe.com; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  }

  # Imágenes y assets cacheables agresivamente
  location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
